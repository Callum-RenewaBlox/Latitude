# Streamlit Community Cloud puts an app to sleep after ~12 hours without a
# visitor, and the next visitor meets a "wake up" page. For a link that goes
# out in a Reel that is fatal, so this pings the app every five hours while it
# lives there.
#
# Set the app URL once in the repo: Settings -> Secrets and variables ->
# Actions -> Variables -> LATITUDE_URL = https://<app>.streamlit.app
# Until it is set, the job does nothing.
#
# This is a stopgap for the demo period. Community Cloud's terms are for
# personal, non-commercial use, so customer editions will live on static
# hosting - see README.
name: keep-awake
on:
  schedule:
    - cron: "17 */5 * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        env:
          URL: ${{ vars.LATITUDE_URL }}
        run: |
          if [ -z "$URL" ]; then echo "LATITUDE_URL not set; nothing to ping"; exit 0; fi
          curl -fsS -o /dev/null --max-time 90 "$URL/?day=ov" && echo "pinged $URL"
